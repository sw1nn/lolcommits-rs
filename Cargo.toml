[package]
name = "sw1nn-lolcommits-rs"
version = "5.0.1"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
nokhwa = { version = "0.10", features = ["input-native"] }
image = "0.25"
imageproc = "0.27"
ab_glyph = "0.2"
git2 = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
derive_more = { version = "2.1", features = ["display", "from", "error"] }
directories = "6.0"
chrono = "0.4"
opencv = { version = "0.100", default-features = false, features = [
  "imgproc",
  "clang-runtime",
  "dnn",
] }
reqwest = { version = "0.13", features = ["blocking", "form", "json", "multipart"] }
md5 = "0.8"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
xdg = "3.0"
fontconfig = "0.11"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.7", features = [
  "fs",
  "sensitive-headers",
  "set-header",
  "trace",
] }
serde_json = "1.0"
png = "0.18"
tempfile = "3.27"
async-stream = "0.3"
futures = "0.3"
owo-colors = { version = "4.1", features = ["supports-colors"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
glob-match = "0.2"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
keyring = "4.2"
notify-rust = { version = "4.18.0", default-features = false, features = ["z"] }

[dev-dependencies]
base64 = "0.22"
temp-env = "0.3"
test-case = "3.3"
tower = { version = "0.5", features = ["util"] }
