<div class="marquee"><span>LOLCOMMITS</span></div>
<div class="strip" data-strip>
    <template data-strip-frame>
        <button type="button" class="frame"><div class="photo"><img data-photo loading="lazy" alt=""></div></button>
    </template>
</div>
<div class="big"><div class="photo"><img data-photo alt=""></div></div>
<div class="ticket">
    <div class="no"><span>ADMIT ONE</span><span>Nº <span data-f="hash"></span></span></div>
    <div class="ttl" data-f="title"></div>
    <div class="meta"><span data-f="typescope"></span> · <span data-f="repo"></span></div>
    <div class="meta" data-f="branch"></div>
    <div class="meta"><span data-f="files"></span> file(s) · +<span data-f="ins"></span> · −<span data-f="del"></span></div>
    <div class="meta"><span data-f="day"></span>, <span data-f="time"></span></div>
</div>
<div class="pad">
    <button class="older" type="button" data-nav="older" aria-label="Older commit (h or left arrow)" aria-keyshortcuts="ArrowLeft h" title="Older commit (h or ←)"></button>
    <span class="pose">h/← POSE <span data-f="pos"></span>/<span data-f="total"></span> →/l</span>
    <button class="newer" type="button" data-nav="newer" aria-label="Newer commit (l or right arrow)" aria-keyshortcuts="ArrowRight l" title="Newer commit (l or →)"></button>
</div>
