<div class="feed">
    <div class="photo"><img data-photo alt=""></div>
    <div class="live"><i></i><span>LIVE</span></div>
    <div class="clock" data-f="clock"></div>
</div>
<div class="lower">
    <div class="kicker">Breaking commit</div>
    <div class="head ell" data-f="title"></div>
    <div class="sub">
        <span data-f="typescope"></span>
        <span class="ell"><span data-f="repo"></span> · <span data-f="branch"></span></span>
        <span class="gap"></span>
        <span class="hash" data-f="hash"></span>
        <span><span data-f="files"></span> file(s) <span class="ins">+<span data-f="ins"></span></span> <span class="del">−<span data-f="del"></span></span></span>
    </div>
</div>
<button class="nav older" type="button" data-nav="older" aria-label="Older commit (h or left arrow)" aria-keyshortcuts="ArrowLeft h" title="Older commit (h or ←)"><span aria-hidden="true">‹</span><span class="key">h</span></button>
<button class="nav newer" type="button" data-nav="newer" aria-label="Newer commit (l or right arrow)" aria-keyshortcuts="ArrowRight l" title="Newer commit (l or →)"><span aria-hidden="true">›</span><span class="key">l</span></button>
<div class="ticker"><b data-keep>LATEST</b><div class="run" data-ticker></div></div>
