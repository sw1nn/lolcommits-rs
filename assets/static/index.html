<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lolcommits Gallery</title>
    <link rel="stylesheet" href="/ui/gallery.css">
    <script>
        // Write the saved style's stylesheet before first paint, so the page
        // does not flash the default style. document.write keeps it
        // render-blocking, which an appended <link> is not.
        // Keep KNOWN_STYLES in sync with STYLES in /ui/gallery.js.
        (function () {
            var KNOWN_STYLES = ['plain', 'museum', 'news', 'film', 'booth', 'term'];
            var id = 'plain';
            try {
                var saved = localStorage.getItem('lolcommits.style');
                if (KNOWN_STYLES.indexOf(saved) >= 0) id = saved;
            } catch (e) {
                // Storage can be blocked; the default style applies
            }
            document.write('<link rel="stylesheet" id="style-css" data-style="' + id + '" href="/ui/styles/' + id + '.css">');
            // Web fonts are optional. media=print keeps this sheet from
            // blocking first paint, and from blocking it forever if Google is
            // unreachable; it switches to all once loaded.
            if (id !== 'plain') {
                document.write('<link rel="stylesheet" id="style-fonts" href="/ui/styles/' + id + '.fonts.css" media="print" onload="this.media=\'all\'">');
            }
        })();
    </script>
</head>
<body>
    <div class="loading-screen" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading lolcommits...</div>
    </div>

    <div class="error-screen" id="error" hidden>
        <h2>😕 No Images Found</h2>
        <p>Make some commits to see your lolcommits here!</p>
    </div>

    <div class="pill" id="pill" hidden>
        <span class="counter">
            <span id="counterText"></span>
            <span class="new-images-badge" id="newImagesBadge" hidden>!</span>
        </span>
        <button class="pill-button" id="infoButton" type="button" aria-label="Toggle commit info" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 16v-4"/>
                <path d="M12 8h.01"/>
            </svg>
        </button>
        <div class="picker" id="picker">
            <button class="pill-button" id="pickerButton" type="button" aria-label="Style" aria-haspopup="menu" aria-expanded="false" aria-controls="pickerMenu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.8-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3Z"/>
                    <circle cx="7.5" cy="10.5" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>
                </svg>
            </button>
            <div class="picker-menu" id="pickerMenu" role="menu" aria-label="Gallery style" hidden>
                <p class="picker-error" id="pickerError" role="status" hidden></p>
            </div>
        </div>
    </div>

    <main id="stage"></main>

    <script src="/ui/gallery.js"></script>
</body>
</html>
